<script>
  /* =========================================================
     1. LƯU TRỮ
     - Công việc: { "2026-09-26": [ {id, text, completed, cat, start, end, duration}, ... ] }
       cat: id nhóm (hoặc null)
       start/end: "08:00" (hoặc null)   duration: số phút (hoặc null)
     - Cài đặt: { categories: [{id, name, color}], lastCat, view }
     - Ghi chú: [ {id, text, updated} ]  (không theo ngày)
     Mỗi ngày một danh sách riêng, KHÔNG tự chuyển việc sang ngày khác.
     ========================================================= */
  const DATA_KEY = 'checklist-data-v1';
  const SETTINGS_KEY = 'checklist-settings-v1';
  const NOTES_KEY = 'checklist-notes-v1';
  const HABITS_KEY = 'checklist-habits-v1';
  const PLANS_KEY = 'checklist-plans-v1';

  // Màu nhóm mặc định: tông dịu, vẫn đủ đậm để đọc chữ
  const DEFAULT_CATEGORIES = [
    { id: 'work',  name: 'Công việc', color: '#4F7CAC' },
    { id: 'study', name: 'Học hành',  color: '#8A6FB5' },
    { id: 'fun',   name: 'Giải trí',  color: '#D07C5A' },
    { id: 'other', name: 'Khác',      color: '#7D8B85' }
  ];

  // Bảng màu gợi ý cho nhóm (chạm vòng màu trong Cài đặt)
  const SOFT_COLORS = ['#5E8C74', '#4E9AA3', '#4F7CAC', '#6C8EBF', '#8A6FB5',
                       '#C46F8A', '#D07C5A', '#B08D45', '#A0735A', '#7D8B85'];

  /* Chủ đề giao diện: nền nhạt + màu nhấn dịu */
  const THEMES = {
    sage:     { name: 'Xanh sage', bg: '#E3ECE6', bg2: '#F2F6F3', accent: '#5E8C74', darkAccent: '#8DBBA2' },
    cream:    { name: 'Kem',       bg: '#F4ECE1', bg2: '#FBF7F1', accent: '#A98463', darkAccent: '#D2B08E' },
    peach:    { name: 'Hồng đào',  bg: '#F5E3DB', bg2: '#FBF3EF', accent: '#C27C68', darkAccent: '#E3A895' },
    sky:      { name: 'Xanh trời', bg: '#E1E9F3', bg2: '#F3F6FA', accent: '#5F86B3', darkAccent: '#94B5DA' },
    lavender: { name: 'Oải hương', bg: '#E6E4F3', bg2: '#F5F4FA', accent: '#7F79B8', darkAccent: '#B3AEE0' },
    classic:  { name: 'Nhất Tâm',  bg: '#F5F6F5', bg2: '#F5F6F5', accent: '#1F7D3A', darkAccent: '#5FB57A' }
  };
  const LIGHT = { card: '#FFFFFF', text: '#2F3A35', muted: '#86918B', line: '#E4EAE6', line2: '#C5CEC9',
                  seg: 'rgba(0,0,0,.05)', nav: 'rgba(255,255,255,.8)', shadow: '0 2px 12px rgba(60,80,70,.07)',
                  'on-accent': '#FFFFFF' };
  const DARK  = { bg: '#1B201E', bg2: '#222826', card: '#2A312E', text: '#E5ECE8', muted: '#95A29B',
                  line: '#37403C', line2: '#56615B', seg: 'rgba(255,255,255,.07)', nav: 'rgba(30,36,33,.85)',
                  shadow: '0 2px 12px rgba(0,0,0,.25)', 'on-accent': '#1B201E' };

  function load(key, fallback) {
    try { return JSON.parse(localStorage.getItem(key)) || fallback; }
    catch (e) { return fallback; }
  }
  function store(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); }
    catch (e) { alert('Không lưu được dữ liệu trên trình duyệt này.'); }
  }

  let data = load(DATA_KEY, {});
  let settings = load(SETTINGS_KEY, { categories: DEFAULT_CATEGORIES, lastCat: null });
  let notes = load(NOTES_KEY, []);
  // Việc lặp lại: [{ id, text, cat, start, end, duration, days: [0..6], from, until, skip: [] }]
  let habits = load(HABITS_KEY, []);
  // Kế hoạch tuần: { "2026-09-28" (Thứ Hai): [ { id, title, cat, items: [ { id, text, done, day } ] } ] }
  // day = ngày đã xếp (việc nhỏ khi đó cũng nằm trong danh sách ngày, nối bằng task.planItem)
  let plans = load(PLANS_KEY, {});

  // Nâng cấp một lần: đổi màu nhóm mặc định cũ (đậm) sang tông dịu, bật chủ đề Xanh sage
  if (settings.v !== 2) {
    const OLD = { work: '#2563EB', study: '#7C3AED', fun: '#EA580C', other: '#6B7280' };
    settings.categories.forEach(c => {
      const soft = DEFAULT_CATEGORIES.find(d => d.id === c.id);
      if (soft && OLD[c.id] && c.color.toUpperCase() === OLD[c.id]) c.color = soft.color;
    });
    settings.theme = settings.theme || 'sage';
    settings.mode = settings.mode || 'light';
    settings.v = 2;
    store(SETTINGS_KEY, settings);
  }

  /* Áp dụng chủ đề + chế độ Ngày/Đêm/Theo máy */
  const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
  function applyTheme() {
    const th = THEMES[settings.theme] || THEMES.sage;
    const dark = settings.mode === 'dark' || (settings.mode === 'auto' && darkQuery.matches);
    const vars = dark ? { ...DARK, green: th.darkAccent }
                      : { ...LIGHT, bg: th.bg, bg2: th.bg2, green: th.accent };
    const root = document.documentElement;
    Object.entries(vars).forEach(([k, v]) => root.style.setProperty('--' + k, v));
    root.style.colorScheme = dark ? 'dark' : 'light';
    document.querySelector('meta[name=theme-color]').content = vars.bg;
  }
  darkQuery.addEventListener && darkQuery.addEventListener('change', applyTheme);
  applyTheme();

  const saveData = () => store(DATA_KEY, data);
  const saveSettings = () => store(SETTINGS_KEY, settings);
  const saveNotes = () => store(NOTES_KEY, notes);
  const saveHabits = () => store(HABITS_KEY, habits);
  const savePlans = () => store(PLANS_KEY, plans);
  const findCat = id => settings.categories.find(c => c.id === id);

  /* =========================================================
     2. NGÀY & GIỜ
     ========================================================= */
  const WEEKDAYS = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
  const pad = n => String(n).padStart(2, '0');

  const toKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  function fromKey(key) {
    const [y, m, d] = key.split('-').map(Number);
    return new Date(y, m - 1, d);
  }
  const todayKey = () => toKey(new Date());
  function shiftKey(key, days) {
    const d = fromKey(key);
    d.setDate(d.getDate() + days);
    return toKey(d);
  }
  const daysFromToday = key => Math.round((fromKey(key) - fromKey(todayKey())) / 86400000);

  const toMin = hhmm => { const [h, m] = hhmm.split(':').map(Number); return h * 60 + m; };

  // 90 -> "1 giờ 30 phút"
  function fmtDuration(min) {
    const h = Math.floor(min / 60), m = min % 60;
    if (!h) return `${m} phút`;
    return m ? `${h} giờ ${m} phút` : `${h} giờ`;
  }

  // Số phút của một việc (tính từ giờ bắt đầu–kết thúc, hoặc thời lượng)
  function taskMinutes(t) {
    if (t.start && t.end) return (toMin(t.end) - toMin(t.start) + 1440) % 1440;
    return t.duration || 0;
  }

  let currentKey = todayKey();
  let lastToday = todayKey();

  /* =========================================================
     3. GÕ NHANH THỜI GIAN NGAY TRONG Ô NHẬP (không bắt buộc)
     "8h-9h30 Soạn bài"   -> 08:00 – 09:30
     "14:00 Họp"          -> bắt đầu 14:00
     "Đọc sách 45p"       -> 45 phút
     "Chạy bộ 1h30p"      -> 90 phút
     "Họp 2 tiếng"        -> 120 phút
     ========================================================= */
  const T = '(\\d{1,2})[:hg](\\d{2})?';   // 8h, 8h30, 08:30, 8g
  function hm(h, m) {
    h = Number(h); m = Number(m || 0);
    return (h < 24 && m < 60) ? `${pad(h)}:${pad(m)}` : null;
  }

  function parseQuick(raw) {
    let m;
    // Khoảng giờ ở đầu hoặc cuối
    if ((m = raw.match(new RegExp(`^${T}\\s*[-–—]\\s*${T}\\s+(.+)$`, 'i')))) {
      const s = hm(m[1], m[2]), e = hm(m[3], m[4]);
      if (s && e) return { text: m[5], start: s, end: e };
    }
    if ((m = raw.match(new RegExp(`^(.+?)\\s+${T}\\s*[-–—]\\s*${T}$`, 'i')))) {
      const s = hm(m[2], m[3]), e = hm(m[4], m[5]);
      if (s && e) return { text: m[1], start: s, end: e };
    }
    // Chỉ giờ bắt đầu ở đầu câu
    if ((m = raw.match(new RegExp(`^${T}\\s+(.+)$`, 'i')))) {
      const s = hm(m[1], m[2]);
      if (s) return { text: m[3], start: s };
    }
    // Thời lượng ở cuối câu
    if ((m = raw.match(/^(.+?)\s+(\d{1,2})\s*(?:h|g|giờ)\s*(\d{1,2})\s*(?:p|ph|phút)$/i)))
      return { text: m[1], duration: m[2] * 60 + Number(m[3]) };
    if ((m = raw.match(/^(.+?)\s+(\d{1,3})\s*(?:p|ph|phút)$/i)))
      return { text: m[1], duration: Number(m[2]) };
    if ((m = raw.match(/^(.+?)\s+(\d{1,2}(?:[.,]5)?)\s*tiếng$/i)))
      return { text: m[1], duration: Math.round(parseFloat(m[2].replace(',', '.')) * 60) };
    return { text: raw };
  }

  /* =========================================================
     4. THAO TÁC VỚI CÔNG VIỆC
     ========================================================= */
  const getTasks = () => data[currentKey] || [];

  function setTasks(tasks) {
    if (tasks.length) data[currentKey] = tasks;
    else delete data[currentKey];
    saveData();
    render();
  }

  const patchTask = (id, patch) => setTasks(getTasks().map(t => t.id === id ? { ...t, ...patch } : t));
  function deleteTask(id) {
    const t = getTasks().find(x => x.id === id);
    const h = t && t.habit && findHabit(t.habit);
    if (h && !h.skip.includes(currentKey)) { h.skip.push(currentKey); saveHabits(); }
    const pi = t && t.planItem && findPlanItem(t.planItem);
    if (pi) { pi.it.day = null; savePlans(); }
    setTasks(getTasks().filter(x => x.id !== id));
  }

  /* ---------- VIỆC LẶP LẠI ----------
     Mỗi việc lặp lại là một "mẫu". Khi mở một ngày (từ hôm nay trở đi),
     app tự thêm việc theo mẫu nếu đúng thứ đã chọn.
     Xoá việc lặp ở ngày nào -> chỉ bỏ ngày đó (ghi vào skip), các ngày khác vẫn còn.
     Ngày đã qua không tự thêm (để không làm rối lịch sử). */
  let seq = 0;
  const uid = () => Date.now() * 100 + (seq++ % 100);
  const WD = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
  const WD_ORDER = [1, 2, 3, 4, 5, 6, 0];          // hiển thị từ Thứ Hai
  const findHabit = id => habits.find(h => h.id === id);

  function daysLabel(days) {
    if (days.length === 7) return 'Mỗi ngày';
    const sorted = WD_ORDER.filter(d => days.includes(d));
    if (sorted.join() === '1,2,3,4,5') return 'T2 – T6';
    return sorted.map(d => WD[d]).join(', ');
  }

  // Tự thêm việc lặp lại vào ngày `key` (trả về true nếu có thay đổi)
  function ensureHabits(key) {
    if (key < todayKey()) return false;
    const wd = fromKey(key).getDay();
    let list = data[key] || [];
    let changed = false;
    habits.forEach(h => {
      if (key < h.from || (h.until && key > h.until)) return;
      if (!h.days.includes(wd) || h.skip.includes(key)) return;
      if (list.some(t => t.habit === h.id)) return;
      list = [...list, { id: uid(), text: h.text, completed: false, cat: h.cat,
                         start: h.start, end: h.end, duration: h.duration, habit: h.id }];
      changed = true;
    });
    if (changed) data[key] = list;
    return changed;
  }

  // Ngừng lặp từ ngày `key` trở đi (việc chưa làm ở các ngày sau bị gỡ)
  function stopHabit(h, key) {
    h.until = shiftKey(key, -1);
    Object.keys(data).forEach(k => {
      if (k < key) return;
      const kept = data[k].filter(t => !(t.habit === h.id && !t.completed));
      if (kept.length) data[k] = kept; else delete data[k];
    });
    habits = habits.filter(x => !(x.until && x.until < x.from));   // chưa dùng ngày nào thì xoá hẳn
    habits.forEach(x => x.skip = x.skip.filter(k => k >= todayKey()));
    saveHabits();
    saveData();
  }

  // Cập nhật mẫu + các ngày sau (chưa làm) khi sửa một việc lặp lại
  function updateHabit(h, fields, fromDay) {
    Object.assign(h, fields);
    Object.keys(data).forEach(k => {
      if (k <= fromDay) return;
      const wdOk = h.days.includes(fromKey(k).getDay());
      data[k] = data[k]
        .filter(t => !(t.habit === h.id && !t.completed && !wdOk))
        .map(t => t.habit === h.id && !t.completed
          ? { ...t, text: h.text, cat: h.cat, start: h.start, end: h.end, duration: h.duration } : t);
      if (!data[k].length) delete data[k];
    });
    saveHabits();
    saveData();
  }

  function createHabit(task, days, fromDay) {
    const h = { id: uid(), text: task.text, cat: task.cat, start: task.start, end: task.end,
                duration: task.duration, days, from: fromDay, until: null, skip: [] };
    habits.push(h);
    saveHabits();
    return h;
  }

  // Chuyển trạng thái của ô chọn nhóm/thời gian thành các trường của công việc
  function fieldsToTask(st) {
    const t = { cat: st.cat || null, start: null, end: null, duration: null };
    if (st.mode === 'range' && st.start) {
      t.start = st.start;
      t.end = st.end || null;
    } else if (st.mode === 'duration' && Number(st.duration) > 0) {
      t.duration = Number(st.duration);
    }
    return t;
  }

  /* =========================================================
     5. KHỐI "NHÓM + THỜI GIAN" (dùng cho cả ô thêm việc và bảng sửa việc)
     st = { cat, mode: 'none'|'range'|'duration', start, end, duration, showTime }
     ========================================================= */
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function timeLabel(st) {
    if (st.mode === 'range' && st.start) return st.end ? `${st.start}–${st.end}` : `từ ${st.start}`;
    if (st.mode === 'duration' && Number(st.duration) > 0) return fmtDuration(Number(st.duration));
    return 'Thời gian';
  }

  // showCats = false: ẩn hàng chọn nhóm (dùng ở ô thêm việc cho gọn)
  // isAdd = true: khối ở ô thêm việc (có nút "Xong" và chip "Lặp lại")
  function makeFields(el, st, showHint, showCats = true, isAdd = false) {
    function render() {
      const hasTime = timeLabel(st) !== 'Thời gian';
      el.innerHTML = `
        <div class="chips">
          ${!showCats ? '' : settings.categories.map(c => `
            <button type="button" class="chip ${st.cat === c.id ? 'on' : ''}" data-cat="${c.id}" style="--c:${c.color}">
              <i></i>${esc(c.name)}
            </button>`).join('')}
          <button type="button" class="chip time ${hasTime ? 'on' : ''}" data-act="time">⏱ ${timeLabel(st)}</button>
          ${isAdd ? `<button type="button" class="chip time ${st.repeat ? 'on' : ''}" data-act="repeat">🔁 ${st.repeat ? 'Mỗi ngày' : 'Lặp lại'}</button>` : ''}
        </div>
        ${st.showTime ? `
        <div class="time-box">
          <div class="seg">
            <button type="button" data-mode="none" class="${st.mode === 'none' ? 'on' : ''}">Không</button>
            <button type="button" data-mode="range" class="${st.mode === 'range' ? 'on' : ''}">Khung giờ</button>
            <button type="button" data-mode="duration" class="${st.mode === 'duration' ? 'on' : ''}">Thời lượng</button>
          </div>
          ${st.mode === 'range' ? `
            <div class="range">
              <input type="time" data-f="start" value="${st.start || ''}" aria-label="Giờ bắt đầu">
              <span>→</span>
              <input type="time" data-f="end" value="${st.end || ''}" aria-label="Giờ kết thúc">
            </div>` : ''}
          ${st.mode === 'duration' ? `
            <div class="dur">
              ${[15, 30, 45, 60, 90, 120].map(n =>
                `<button type="button" class="chip ${Number(st.duration) === n ? 'on' : ''}" style="--c:var(--green)" data-dur="${n}">${n < 60 ? n + 'p' : fmtDuration(n).replace(' giờ', 'g').replace(' phút', 'p')}</button>`
              ).join('')}
              <input type="number" inputmode="numeric" min="1" data-f="duration" value="${st.duration || ''}" placeholder="Số">
              <span>phút</span>
            </div>` : ''}
          ${isAdd ? `<button type="button" class="time-done" data-act="done">Xong</button>` : ''}
        </div>` : ''}`;
    }

    el.addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b) return;
      if (b.dataset.cat) st.cat = st.cat === b.dataset.cat ? null : b.dataset.cat;   // chạm lần nữa = bỏ chọn
      else if (b.dataset.act === 'time') {
        st.showTime = !st.showTime;
        if (st.showTime && st.mode === 'none') st.mode = 'range';
      }
      else if (b.dataset.act === 'done') st.showTime = false;
      else if (b.dataset.act === 'repeat') st.repeat = !st.repeat;
      else if (b.dataset.mode) st.mode = b.dataset.mode;
      else if (b.dataset.dur) st.duration = b.dataset.dur;
      render();
    });
    // Khi chọn giờ: chỉ cập nhật nhãn ⏱, KHÔNG vẽ lại khối
    // (vẽ lại sẽ làm bộ chọn giờ của điện thoại tự đóng khi chưa chọn xong)
    const updateLabel = () => {
      const chip = el.querySelector('[data-act=time]');
      if (!chip) return;
      chip.textContent = '⏱ ' + timeLabel(st);
      chip.classList.toggle('on', timeLabel(st) !== 'Thời gian');
    };
    const onValue = e => {
      if (!e.target.dataset.f) return;
      st[e.target.dataset.f] = e.target.value;
      updateLabel();
    };
    el.addEventListener('input', onValue);
    el.addEventListener('change', onValue);

    render();
    return { render };
  }

  /* =========================================================
     6. HIỂN THỊ
     ========================================================= */
  const $ = id => document.getElementById(id);
  const listEl = $('list');

  const CHECK_SVG =
    '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';
  const CHECK_BTN = `<button class="check" aria-label="Hoàn thành"><span>${CHECK_SVG}</span></button>`;

  // Dòng phụ dưới tên việc: giờ · thời lượng (nhóm đã thể hiện bằng màu chữ)
  function metaLine(t, cat) {
    const parts = [];
    if (t.start && t.end) parts.push(`${t.start} – ${t.end} (${fmtDuration(taskMinutes(t))})`);
    else if (t.start) parts.push(`từ ${t.start}`);
    else if (t.duration) parts.push(fmtDuration(t.duration));
    const h = t.habit && findHabit(t.habit);
    if (h) parts.unshift('🔁 ' + daysLabel(h.days));
    const pi = t.planItem && findPlanItem(t.planItem);
    if (pi) parts.push(`<span class="ptag">📌 ${esc(pi.g.title)}</span>`);
    return parts.join(' · ');
  }

  // Việc có giờ bắt đầu xếp trước theo giờ; việc không có giờ giữ thứ tự đã thêm
  function sortTasks(tasks) {
    return [...tasks].sort((a, b) => {
      if (a.start && b.start) return toMin(a.start) - toMin(b.start);
      if (a.start) return -1;
      if (b.start) return 1;
      return 0;
    });
  }

  function renderList(tasks) {
    listEl.innerHTML = '';
    const nextList = data[shiftKey(currentKey, 1)] || [];
    tasks.forEach(t => {
      // Nút "→ mai": chỉ hiện với việc chưa xong, không phải việc lặp lại (việc lặp đã tự có ở ngày sau)
      const canMove = !t.completed && !t.habit;
      const copied = canMove && nextList.some(x => x.copiedFrom === t.id);
      const cat = findCat(t.cat);
      const li = document.createElement('li');
      li.className = 'item' + (t.completed ? ' done' : '');
      li.dataset.id = t.id;
      if (cat) li.style.setProperty('--c', cat.color);
      const meta = metaLine(t, cat);
      li.innerHTML = `
        ${CHECK_BTN}
        <div class="body">
          <div class="text">${esc(t.text)}</div>
          ${meta ? `<div class="meta">${meta}</div>` : ''}
        </div>
        ${canMove ? (copied
          ? '<button class="move copied" aria-label="Đã chép sang ngày sau"><b>✓</b></button>'
          : '<button class="move" aria-label="Chép sang ngày sau"><b>→</b></button>') : ''}
        <button class="del" aria-label="Xoá">×</button>`;
      listEl.appendChild(li);
    });
  }

  // Tổng thời gian theo từng nhóm
  function totalsHTML(tasks) {
    const sums = new Map();
    tasks.forEach(t => {
      const min = taskMinutes(t);
      if (!min) return;
      const key = findCat(t.cat) ? t.cat : '';
      sums.set(key, (sums.get(key) || 0) + min);
    });
    const parts = [];
    settings.categories.forEach(c => {
      if (sums.has(c.id)) parts.push(`<span style="--c:${c.color}"><i></i>${esc(c.name)} <b>${fmtDuration(sums.get(c.id))}</b></span>`);
    });
    if (!parts.length) return '';   // chỉ có việc chưa phân nhóm -> đã có ở dòng "Tổng"
    if (sums.has('')) parts.push(`<span style="--c:#C4C9C6"><i></i>Chưa phân nhóm <b>${fmtDuration(sums.get(''))}</b></span>`);
    return parts.join('');
  }
  const renderTotals = tasks => { $('totals').innerHTML = totalsHTML(tasks); };

  /* ---------- KẾ HOẠCH TUẦN ----------
     Mục tiêu lớn của tuần -> chia thành việc nhỏ.
     Mỗi việc nhỏ: tick luôn, hoặc xếp vào 1 ngày (khi đó nó cũng hiện trong danh sách ngày đó).
     Tick / sửa tên / xoá ở ngày hay ở kế hoạch đều đồng bộ với nhau. */
  const openGoals = new Set();     // mục tiêu đang mở
  let pickerFor = null;            // việc nhỏ đang mở hàng chọn ngày
  let editingItem = null;          // việc nhỏ đang sửa tên
  let refocus = null;              // ô nhập cần đặt lại con trỏ sau khi vẽ lại

  function findPlanItem(itemId) {
    for (const wk in plans) for (const g of plans[wk]) {
      const it = g.items.find(i => i.id === itemId);
      if (it) return { wk, g, it };
    }
    return null;
  }
  const findGoal = (wk, gid) => (plans[wk] || []).find(g => g.id === gid);

  // Gỡ việc nhỏ khỏi ngày đã xếp
  function unschedule(it) {
    if (!it.day) return;
    const kept = (data[it.day] || []).filter(t => t.planItem !== it.id);
    if (kept.length) data[it.day] = kept; else delete data[it.day];
    it.day = null;
  }
  // Xếp việc nhỏ vào ngày `day`
  function schedule(g, it, day) {
    unschedule(it);
    data[day] = [...(data[day] || []), { id: uid(), text: it.text, completed: it.done, cat: g.cat,
                                          start: null, end: null, duration: null, planItem: it.id }];
    it.day = day;
  }
  const taskOf = it => it.day && (data[it.day] || []).find(t => t.planItem === it.id);

  function savePlanAll(wk) {
    if (plans[wk] && !plans[wk].length) delete plans[wk];
    savePlans();
    saveData();
    render();
    if (refocus) {
      const el = $('rangeView').querySelector(refocus);
      if (el) el.focus();
      refocus = null;
    }
  }

  // Hiện nút "chuyển sang tuần sau" từ Thứ Sáu của tuần này, hoặc khi xem tuần đã qua
  function canCarry(wk) {
    const thisWeek = weekStart(todayKey());
    return wk < thisWeek || (wk === thisWeek && [5, 6, 0].includes(new Date().getDay()));
  }

  function planHTML(wk, keys) {
    const goals = plans[wk] || [];
    const all = goals.flatMap(g => g.items);
    const left = all.filter(i => !i.done).length;
    return `
      <div class="plan" data-wk="${wk}">
        <div class="plan-h"><b>📌 Kế hoạch tuần</b>${all.length ? `<span>${all.length - left}/${all.length} việc nhỏ</span>` : ''}</div>
        ${goals.map(g => {
          const cat = findCat(g.cat);
          const done = g.items.filter(i => i.done).length;
          const open = openGoals.has(g.id);
          return `
            <div class="goal" data-g="${g.id}" ${cat ? `style="--c:${cat.color}"` : ''}>
              <div class="g-head" data-act="toggle">
                <span class="arrow">${open ? '▼' : '▶'}</span>
                <span class="g-title">${esc(g.title)}</span>
                <span class="g-count">${g.items.length ? `${done}/${g.items.length}` : ''}</span>
              </div>
              ${g.items.length ? `<div class="g-bar"><i style="width:${done / g.items.length * 100}%"></i></div>` : ''}
              ${open ? g.items.map(it => `
                <div class="p-item ${it.done ? 'done' : ''}" data-i="${it.id}">
                  <button class="p-ck" data-act="tick" aria-label="Hoàn thành"><span>${CHECK_SVG}</span></button>
                  ${editingItem === it.id
                    ? `<input class="p-edit" data-act="rename" value="${esc(it.text)}" enterkeyhint="done">`
                    : `<span class="p-text" data-act="edit">${esc(it.text)}</span>`}
                  <button class="p-day ${it.day ? 'on' : ''}" data-act="pick">${it.day ? WD[fromKey(it.day).getDay()] : '＋ ngày'}</button>
                  <button class="p-del" data-act="del" aria-label="Xoá">×</button>
                </div>
                ${pickerFor === it.id ? `<div class="p-wd" data-i="${it.id}">${keys.map(k =>
                  `<button data-act="setday" data-day="${k}" class="${it.day === k ? 'on' : ''}">${WD[fromKey(k).getDay()]}</button>`).join('')}</div>` : ''}
              `).join('') + `
                <input class="p-add" data-act="additem" placeholder="＋ Thêm việc nhỏ…" enterkeyhint="done">
                <button class="g-edit" data-act="editgoal">Sửa / xoá mục tiêu</button>` : ''}
            </div>`;
        }).join('')}
        <input class="p-add goal-add" data-act="addgoal" placeholder="＋ Thêm mục tiêu tuần…" enterkeyhint="done">
        ${left && canCarry(wk) ? `<button class="carry-all" data-act="carry">→ Chuyển ${left} việc chưa xong sang tuần sau</button>` : ''}
      </div>`;
  }

  function onPlanClick(e) {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    const act = btn.dataset.act;
    const wk = e.target.closest('.plan').dataset.wk;
    const gEl = e.target.closest('.goal');
    const g = gEl && findGoal(wk, Number(gEl.dataset.g));
    const iEl = e.target.closest('[data-i]');
    const it = g && iEl && g.items.find(i => i.id === Number(iEl.dataset.i));

    if (act === 'toggle') {
      openGoals.has(g.id) ? openGoals.delete(g.id) : openGoals.add(g.id);
      return render();
    }
    if (act === 'tick') {
      it.done = !it.done;
      const t = taskOf(it);
      if (t) t.completed = it.done;
      return savePlanAll(wk);
    }
    if (act === 'edit') { editingItem = it.id; refocus = '.p-edit'; return savePlanAll(wk); }
    if (act === 'pick') { pickerFor = pickerFor === it.id ? null : it.id; return render(); }
    if (act === 'setday') {
      const day = btn.dataset.day;
      if (it.day === day) unschedule(it); else schedule(g, it, day);   // chạm lại ngày đang chọn = bỏ xếp
      pickerFor = null;
      return savePlanAll(wk);
    }
    if (act === 'del') {
      unschedule(it);
      g.items = g.items.filter(i => i !== it);
      return savePlanAll(wk);
    }
    if (act === 'editgoal') return openGoalSheet(wk, g);
    if (act === 'carry') return carryWeek(wk);
  }

  // Nhập mục tiêu / việc nhỏ / sửa tên: Enter để lưu
  $('rangeView').addEventListener('keydown', e => {
    if (e.key !== 'Enter' || !e.target.closest('.plan')) return;
    e.preventDefault();
    const act = e.target.dataset.act;
    const wk = e.target.closest('.plan').dataset.wk;
    const gEl = e.target.closest('.goal');
    const g = gEl && findGoal(wk, Number(gEl.dataset.g));
    const text = e.target.value.trim();

    if (act === 'addgoal' && text) {
      const ng = { id: uid(), title: text, cat: null, items: [] };
      plans[wk] = [...(plans[wk] || []), ng];
      openGoals.add(ng.id);
      refocus = `.goal[data-g="${ng.id}"] .p-add`;          // gõ việc nhỏ ngay
    }
    if (act === 'additem' && text) {
      g.items.push({ id: uid(), text, done: false, day: null });
      refocus = `.goal[data-g="${g.id}"] .p-add`;           // gõ tiếp việc nhỏ khác
    }
    if (act === 'rename') {
      const it = g.items.find(i => i.id === Number(e.target.closest('[data-i]').dataset.i));
      if (text) {
        it.text = text;
        const t = taskOf(it);
        if (t) t.text = text;
      }
      editingItem = null;
    }
    savePlanAll(wk);
  });
  // Sửa tên: chạm ra ngoài cũng lưu
  $('rangeView').addEventListener('focusout', e => {
    if (e.target.dataset.act !== 'rename') return;
    e.target.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
  });

  // Sửa tên / nhóm màu / xoá mục tiêu
  function openGoalSheet(wk, g) {
    const st = { cat: g.cat };
    sheet.innerHTML = `
      <h2>Mục tiêu tuần</h2>
      <input class="text-input" id="goalText" type="text" enterkeyhint="done">
      <div class="chips" id="goalCats">${settings.categories.map(c =>
        `<button type="button" class="chip ${st.cat === c.id ? 'on' : ''}" data-cat="${c.id}" style="--c:${c.color}"><i></i>${esc(c.name)}</button>`).join('')}</div>
      <div class="actions">
        <button class="danger" id="goalDel">Xoá</button>
        <button id="goalCancel">Huỷ</button>
        <button class="primary" id="goalSave">Lưu</button>
      </div>`;
    $('goalText').value = g.title;
    $('goalCats').onclick = e => {
      const b = e.target.closest('[data-cat]');
      if (!b) return;
      st.cat = st.cat === b.dataset.cat ? null : b.dataset.cat;
      $('goalCats').querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x.dataset.cat === st.cat));
    };
    $('goalSave').onclick = () => {
      g.title = $('goalText').value.trim() || g.title;
      g.cat = st.cat;
      g.items.forEach(it => { const t = taskOf(it); if (t) t.cat = g.cat; });   // việc đã xếp ngày đổi màu theo
      closeSheet();
      savePlanAll(wk);
    };
    $('goalCancel').onclick = closeSheet;
    $('goalDel').onclick = () => {
      if (!confirm(`Xoá mục tiêu “${g.title}” và ${g.items.length} việc nhỏ của nó?`)) return;
      g.items.forEach(unschedule);
      plans[wk] = plans[wk].filter(x => x !== g);
      closeSheet();
      savePlanAll(wk);
    };
    openSheet();
  }

  // Chuyển việc nhỏ chưa xong sang tuần sau (gỡ khỏi ngày đã xếp ở tuần này)
  function carryWeek(wk) {
    const next = shiftKey(wk, 7);
    const nextGoals = plans[next] || [];
    let count = 0;
    plans[wk].forEach(g => {
      const left = g.items.filter(i => !i.done);
      if (!left.length) return;
      left.forEach(unschedule);
      let ng = nextGoals.find(x => x.from === g.id);
      if (!ng) { ng = { id: uid(), title: g.title, cat: g.cat, from: g.id, items: [] }; nextGoals.push(ng); }
      left.forEach(i => ng.items.push({ id: uid(), text: i.text, done: false, day: null }));
      g.items = g.items.filter(i => i.done);
      count += left.length;
    });
    plans[wk] = plans[wk].filter(g => g.items.length);
    plans[next] = nextGoals;
    savePlanAll(wk);
    toast(`Đã chuyển ${count} việc sang tuần sau ✓`);
  }

  /* ---------- Tuần / Tháng ---------- */
  let span = 'day';   // 'day' | 'week' | 'month' — mỗi lần mở app luôn vào xem Ngày

  const weekStart = key => { const d = fromKey(key); return shiftKey(key, -((d.getDay() + 6) % 7)); };
  const monthKey = (key, add) => { const d = fromKey(key); return toKey(new Date(d.getFullYear(), d.getMonth() + add, 1)); };
  const shortDay = key => { const d = fromKey(key); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}`; };

  function rangeSummary(keys) {
    const all = keys.flatMap(k => data[k] || []);
    const done = all.filter(t => t.completed).length;
    const total = all.reduce((s, t) => s + taskMinutes(t), 0);
    if (!all.length) return '<p class="range-sum">Chưa có công việc</p>';
    return `<p class="range-sum">${done} / ${all.length} hoàn thành${total ? ' · Tổng ' + fmtDuration(total) : ''}</p>
            <div class="totals">${totalsHTML(all)}</div>`;
  }

  function renderWeek() {
    const start = weekStart(currentKey);
    const keys = [...Array(7)].map((_, i) => shiftKey(start, i));
    let changed = false;
    keys.forEach(k => { if (ensureHabits(k)) changed = true; });
    if (changed) saveData();
    const today = todayKey();

    const d0 = fromKey(start), d6 = fromKey(keys[6]);
    $('dateText').textContent = `${shortDay(start)} – ${shortDay(keys[6])}/${d6.getFullYear()}`;
    const w = Math.round((fromKey(start) - fromKey(weekStart(today))) / (7 * 86400000));
    $('relText').textContent = w === 0 ? 'Tuần này' : w === -1 ? 'Tuần trước' : w === 1 ? 'Tuần sau' :
                               w > 0 ? `${w} tuần nữa` : `${-w} tuần trước`;
    $('prevBtn').textContent = '‹ Tuần trước';
    $('nextBtn').textContent = 'Tuần sau ›';
    $('todayBtn').textContent = 'Tuần này';
    $('todayBtn').hidden = w === 0;

    $('rangeView').innerHTML = planHTML(start, keys) +
      keys.map(k => {
        const d = fromKey(k);
        const tasks = sortTasks(data[k] || []);
        const done = tasks.filter(t => t.completed).length;
        const shown = tasks.slice(0, 6);
        return `
          <div class="wk-day ${k === today ? 'today' : ''} ${k < today ? 'past' : ''}" data-key="${k}">
            <div class="wk-head">
              <b>${WEEKDAYS[d.getDay()]}</b><span>${shortDay(k)}</span>
              ${tasks.length ? `<span class="wk-count">${done}/${tasks.length}</span>` : ''}
            </div>
            ${tasks.length ? `<ul class="wk-tasks">${shown.map(t => {
              const cat = findCat(t.cat);
              return `<li class="${t.completed ? 'done' : ''}" ${cat ? `style="--c:${cat.color}"` : ''}>
                        ${t.start ? `<small>${t.start}</small>` : ''}${esc(t.text)}</li>`;
            }).join('')}</ul>
            ${tasks.length > shown.length ? `<p class="wk-more">+ ${tasks.length - shown.length} việc nữa</p>` : ''}`
            : '<p class="wk-empty">Trống</p>'}
          </div>`;
      }).join('') + rangeSummary(keys);
  }

  function renderMonth() {
    const first = monthKey(currentKey, 0);
    const d1 = fromKey(first);
    const gridStart = weekStart(first);
    const nextMonth = monthKey(currentKey, 1);
    const keys = [];
    for (let k = gridStart; k < nextMonth || keys.length % 7; k = shiftKey(k, 1)) keys.push(k);
    const inMonth = keys.filter(k => k >= first && k < nextMonth);
    let changed = false;
    inMonth.forEach(k => { if (ensureHabits(k)) changed = true; });
    if (changed) saveData();
    const today = todayKey();

    $('dateText').textContent = `Tháng ${d1.getMonth() + 1}, ${d1.getFullYear()}`;
    const t = fromKey(today);
    const m = (d1.getFullYear() - t.getFullYear()) * 12 + d1.getMonth() - t.getMonth();
    $('relText').textContent = m === 0 ? 'Tháng này' : m === -1 ? 'Tháng trước' : m === 1 ? 'Tháng sau' :
                               m > 0 ? `${m} tháng nữa` : `${-m} tháng trước`;
    $('prevBtn').textContent = '‹ Tháng trước';
    $('nextBtn').textContent = 'Tháng sau ›';
    $('todayBtn').textContent = 'Tháng này';
    $('todayBtn').hidden = m === 0;

    $('rangeView').innerHTML = `
      <div class="month">
        <div class="m-row">${WD_ORDER.map(i => `<div class="m-wd">${WD[i]}</div>`).join('')}</div>
        <div class="m-row">
          ${keys.map(k => {
            const tasks = sortTasks(data[k] || []);
            const dots = tasks.slice(0, 6).map(x => {
              const cat = findCat(x.cat);
              return `<i class="${x.completed ? 'done' : ''}" ${cat ? `style="--c:${cat.color}"` : ''}></i>`;
            }).join('');
            return `
              <div class="m-cell ${k === today ? 'today' : ''} ${k < first || k >= nextMonth ? 'out' : ''}" data-key="${k}">
                <div class="m-num">${fromKey(k).getDate()}</div>
                <div class="m-dots">${dots}</div>
                ${tasks.length > 6 ? `<div class="m-more">+${tasks.length - 6}</div>` : ''}
              </div>`;
          }).join('')}
        </div>
      </div>` + rangeSummary(inMonth);
  }

  function render() {
    document.querySelectorAll('#spanTabs button').forEach(b =>
      b.classList.toggle('on', b.dataset.span === span));
    $('dayView').hidden = span !== 'day';
    $('rangeView').hidden = span === 'day';
    $('datePicker').value = currentKey;
    if (span === 'week') return renderWeek();
    if (span === 'month') return renderMonth();

    // Tự thêm việc lặp lại cho ngày đang xem
    if (ensureHabits(currentKey)) saveData();

    // Dòng nhắc: kế hoạch tuần còn việc nhỏ chưa xếp ngày
    const unplanned = (plans[weekStart(currentKey)] || [])
      .flatMap(g => g.items).filter(i => !i.done && !i.day).length;
    $('planBanner').hidden = unplanned === 0;
    $('planBanner').innerHTML = `<div>📌 Kế hoạch tuần: <b>${unplanned} việc chưa xếp ngày</b></div><span>Xem ›</span>`;

    const diff = daysFromToday(currentKey);
    const d = fromKey(currentKey);
    $('todayBtn').textContent = 'Hôm nay';

    $('dateText').textContent =
      `${WEEKDAYS[d.getDay()]}, ${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`;
    $('relText').textContent =
      diff === 0 ? 'Hôm nay' : diff === -1 ? 'Hôm qua' : diff === 1 ? 'Ngày mai' :
      diff > 0 ? `${diff} ngày nữa` : `${-diff} ngày trước`;
    $('datePicker').value = currentKey;

    $('prevBtn').textContent = diff === 0 ? '‹ Hôm qua' : '‹ Ngày trước';
    $('nextBtn').textContent = diff === 0 ? 'Ngày mai ›' : 'Ngày sau ›';
    $('todayBtn').hidden = diff === 0;

    const tasks = getTasks();
    const sorted = sortTasks(tasks);

    renderList(sorted);

    // Tiến độ + tổng thời gian
    const done = tasks.filter(t => t.completed).length;
    const total = tasks.reduce((s, t) => s + taskMinutes(t), 0);
    $('bar').hidden = tasks.length === 0;
    $('barFill').style.width = tasks.length ? (done / tasks.length * 100) + '%' : '0';
    $('progressText').textContent = tasks.length
      ? `${done} / ${tasks.length} hoàn thành` + (total ? ` · Tổng ${fmtDuration(total)}` : '')
      : 'Chưa có công việc';
    renderTotals(tasks);

    // Nút chép tất cả việc chưa xong sang ngày sau
    const pending = carryCandidates();
    $('carryAll').hidden = pending.length === 0;
    $('carryAll').textContent = `→ Chép ${pending.length} việc chưa xong sang ${nextDayLabel()}`;
  }

  /* ---------- CHÉP VIỆC CHƯA XONG SANG NGÀY SAU ----------
     Việc ở ngày hiện tại giữ nguyên; ngày sau có thêm một bản sao (chưa tick).
     Bản sao nhớ "copiedFrom" để không chép trùng 2 lần. */
  function nextDayLabel() {
    const next = shiftKey(currentKey, 1);
    return next === shiftKey(todayKey(), 1) ? 'ngày mai' : 'ngày ' + shortDay(next);
  }

  function carryCandidates() {
    const nextList = data[shiftKey(currentKey, 1)] || [];
    return getTasks().filter(t => !t.completed && !t.habit && !nextList.some(x => x.copiedFrom === t.id));
  }

  function copyToNextDay(tasks) {
    const next = shiftKey(currentKey, 1);
    ensureHabits(next);
    const list = data[next] || [];
    tasks.forEach(t => {
      if (list.some(x => x.copiedFrom === t.id)) return;
      list.push({ id: uid(), text: t.text, completed: false, cat: t.cat,
                  start: t.start, end: t.end, duration: t.duration, copiedFrom: t.id });
    });
    data[next] = list;
    saveData();
    render();
  }

  let toastTimer;
  function toast(msg) {
    const el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
  }

  $('spanTabs').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    span = b.dataset.span;
    render();
    window.scrollTo(0, 0);
  });

  // Chạm một ngày trong Tuần/Tháng -> mở ngày đó
  $('rangeView').addEventListener('click', e => {
    if (e.target.closest('.plan')) return onPlanClick(e);
    const el = e.target.closest('[data-key]');
    if (!el) return;
    span = 'day';
    goTo(el.dataset.key);
    window.scrollTo(0, 0);
  });


  /* =========================================================
     7. THÊM VIỆC
     ========================================================= */
  // Việc mới chưa có nhóm; chạm vào việc để chọn nhóm (màu chữ)
  const addState = { cat: null, mode: 'none', start: '', end: '', duration: '', showTime: false, repeat: false };
  const addFields = makeFields($('addFields'), addState, true, false, true);

  // Chạm chip không làm mất con trỏ khỏi ô nhập (đỡ phải bấm lại)
  $('addFields').addEventListener('mousedown', e => {
    if (e.target.closest('button')) e.preventDefault();
  });

  $('addForm').addEventListener('submit', e => {
    e.preventDefault();
    const input = $('newTask');
    const raw = input.value.trim();
    if (!raw) return;

    const quick = parseQuick(raw);
    const task = { id: Date.now(), text: quick.text, completed: false, ...fieldsToTask(addState) };
    if (quick.start) Object.assign(task, { start: quick.start, end: quick.end || null, duration: null });
    if (quick.duration) Object.assign(task, { start: null, end: null, duration: quick.duration });

    // Bật 🔁 Lặp lại: tạo mẫu lặp mỗi ngày từ ngày đang xem
    if (addState.repeat) {
      task.habit = createHabit(task, [0, 1, 2, 3, 4, 5, 6], currentKey).id;
      addState.repeat = false;
    }

    setTasks([...getTasks(), task]);

    // Việc tiếp theo bắt đầu từ giờ kết thúc của việc này
    if (addState.mode === 'range' && addState.end) { addState.start = addState.end; addState.end = ''; }
    else { addState.start = ''; addState.end = ''; }
    addState.duration = '';
    addFields.render();

    input.value = '';
    input.focus();
  });

  /* =========================================================
     8. BẢNG TRƯỢT: SỬA CÔNG VIỆC & CÀI ĐẶT NHÓM MÀU
     ========================================================= */
  const backdrop = $('backdrop');
  const sheet = $('sheet');
  function openSheet() { backdrop.hidden = false; }
  function closeSheet() { backdrop.hidden = true; sheet.innerHTML = ''; }
  backdrop.addEventListener('click', e => { if (e.target === backdrop) closeSheet(); });

  // --- Sửa công việc ---
  function openEdit(id) {
    const t = getTasks().find(x => x.id === id);
    if (!t) return;
    const st = {
      cat: t.cat,
      mode: t.start ? 'range' : t.duration ? 'duration' : 'none',
      start: t.start || '', end: t.end || '', duration: t.duration || '',
      showTime: true
    };
    sheet.innerHTML = `
      <h2>Sửa công việc</h2>
      <input class="text-input" id="editText" type="text" enterkeyhint="done">
      <div id="editFields"></div>
      <div class="sub-label">🔁 Lặp lại</div>
      <div id="editRepeat"></div>
      <div class="actions">
        <button class="danger" id="editDel">Xoá</button>
        <button id="editCancel">Huỷ</button>
        <button class="primary" id="editSave">Lưu</button>
      </div>`;
    $('editText').value = t.text;
    makeFields($('editFields'), st, false);

    // --- Lặp lại: Không / Mỗi ngày / Chọn thứ ---
    const oldHabit = t.habit && findHabit(t.habit);
    let days = oldHabit ? [...oldHabit.days] : [];
    let repMode = !oldHabit ? 'none' : days.length === 7 ? 'daily' : 'custom';
    const drawRepeat = () => {
      $('editRepeat').innerHTML = `
        <div class="seg">
          <button type="button" data-rep="none" class="${repMode === 'none' ? 'on' : ''}">Không</button>
          <button type="button" data-rep="daily" class="${repMode === 'daily' ? 'on' : ''}">Mỗi ngày</button>
          <button type="button" data-rep="custom" class="${repMode === 'custom' ? 'on' : ''}">Chọn thứ</button>
        </div>
        ${repMode === 'custom' ? `<div class="wd-chips">${WD_ORDER.map(d =>
          `<button type="button" class="chip ${days.includes(d) ? 'on' : ''}" data-wd="${d}">${WD[d]}</button>`).join('')}</div>` : ''}
`;
    };
    $('editRepeat').onclick = e => {
      const b = e.target.closest('button');
      if (!b) return;
      if (b.dataset.rep) {
        repMode = b.dataset.rep;
        if (repMode === 'daily') days = [0, 1, 2, 3, 4, 5, 6];
        if (repMode === 'custom' && (!days.length || days.length === 7)) days = [1, 2, 3, 4, 5];
      }
      if (b.dataset.wd) {
        const d = Number(b.dataset.wd);
        days = days.includes(d) ? days.filter(x => x !== d) : [...days, d];
      }
      drawRepeat();
    };
    drawRepeat();

    const save = () => {
      const text = $('editText').value.trim() || t.text;
      const fields = { text, ...fieldsToTask(st) };
      if (repMode === 'custom' && !days.length) repMode = 'none';
      if (repMode === 'none' && oldHabit) {
        if (!oldHabit.skip.includes(currentKey)) oldHabit.skip.push(currentKey);
        stopHabit(oldHabit, shiftKey(currentKey, 1));   // giữ việc hôm nay (thành việc thường), bỏ các ngày sau
        fields.habit = null;
      } else if (repMode !== 'none' && oldHabit) {
        updateHabit(oldHabit, { ...fields, days }, currentKey);
      } else if (repMode !== 'none') {
        fields.habit = createHabit({ ...t, ...fields }, days, currentKey).id;
      }
      const pi = t.planItem && findPlanItem(t.planItem);
      if (pi) { pi.it.text = fields.text; savePlans(); }
      patchTask(id, fields);
      closeSheet();
    };
    $('editSave').onclick = save;
    $('editText').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); save(); } };
    $('editCancel').onclick = closeSheet;
    $('editDel').onclick = () => { deleteTask(id); closeSheet(); };
    openSheet();
  }

  // --- Cài đặt nhóm màu: đổi tên, đổi màu, thêm, xoá ---
  function refreshAll() { saveSettings(); render(); addFields.render(); }

  let openSwatch = null;   // nhóm đang mở bảng màu gợi ý

  function openSettings() {
    const scroll = sheet.scrollTop;
    sheet.innerHTML = `
      <h2>Cài đặt</h2>

      <h3 class="first">Giao diện</h3>
      <div class="themes">
        ${Object.entries(THEMES).map(([id, t]) => `
          <button type="button" class="theme ${settings.theme === id ? 'on' : ''}" data-theme="${id}"
                  style="background:linear-gradient(160deg, ${t.bg}, ${t.bg2})">
            ${t.name}<i style="background:${t.accent}"></i>
          </button>`).join('')}
      </div>
      <div class="seg" id="modeSeg">
        ${[['light', '☀︎ Ngày'], ['dark', '☾ Đêm'], ['auto', 'Theo máy']].map(([m, label]) =>
          `<button type="button" data-mode="${m}" class="${settings.mode === m ? 'on' : ''}">${label}</button>`).join('')}
      </div>

      <h3>Nhóm công việc</h3>
      <p class="hint" style="margin:0 0 12px">Tên việc hiện theo màu của nhóm. Chạm vào một việc để chọn nhóm cho việc đó.</p>
      <div id="catList">
        ${settings.categories.map(c => `
          <div class="cat-row" data-id="${c.id}">
            <button type="button" class="cat-color" style="background:${c.color}" aria-label="Đổi màu"></button>
            <input type="text" value="${esc(c.name)}" aria-label="Tên nhóm" style="color:${c.color}">
            <button class="del" aria-label="Xoá nhóm">×</button>
          </div>
          ${openSwatch === c.id ? `
          <div class="swatches" data-id="${c.id}">
            ${SOFT_COLORS.map(col =>
              `<button type="button" class="swatch ${c.color.toUpperCase() === col ? 'on' : ''}" data-color="${col}" style="background:${col}"></button>`).join('')}
            <label class="swatch custom" aria-label="Màu khác"><input type="color" value="${c.color}"></label>
          </div>` : ''}`).join('')}
      </div>
      <button class="add-cat" id="addCat">＋ Thêm nhóm</button>

      <h3>Việc lặp lại</h3>
      <div id="habitList">
        ${habits.filter(h => !h.until || h.until >= todayKey()).map(h => {
          const cat = findCat(h.cat);
          return `<div class="habit-row" data-id="${h.id}" ${cat ? `style="--c:${cat.color}"` : ''}>
                    <div><b>${esc(h.text)}</b><small>🔁 ${daysLabel(h.days)}${h.start ? ' · ' + h.start : ''}</small></div>
                    <button type="button">Ngừng lặp</button>
                  </div>`;
        }).join('') || '<p class="hint">Chưa có. Bấm 🔁 khi thêm việc, hoặc chạm vào một việc → Lặp lại.</p>'}
      </div>

      <h3>Dọn dữ liệu</h3>
      <p class="hint" id="clUsage"></p>
      <div class="cl-dates">
        <label>Từ ngày<input type="date" id="clFrom"></label>
        <label>Đến ngày<input type="date" id="clTo"></label>
      </div>
      <div class="chips" style="margin-top:10px">
        <button type="button" class="chip" id="clBeforeToday">Trước hôm nay</button>
        <button type="button" class="chip" id="clAll">Tất cả</button>
      </div>
      <label class="check-row">
        <input type="checkbox" id="clNotes">
        Xoá cả ghi chú (sửa lần cuối trong khoảng này)
      </label>
      <p class="cl-count" id="clCount"></p>
      <button class="danger-btn" id="clRun">Xoá dữ liệu trong khoảng này</button>
      <button class="reset-btn" id="resetAll">Reset toàn bộ app</button>

      <div class="actions"><button class="primary" id="settingsDone">Xong</button></div>`;

    setupCleanup();

    $('habitList').onclick = e => {
      const row = e.target.closest('.habit-row');
      if (!row || !e.target.closest('button')) return;
      const h = findHabit(Number(row.dataset.id));
      if (!h || !confirm(`Ngừng lặp “${h.text}” từ hôm nay?\nCác việc đã làm vẫn được giữ lại.`)) return;
      stopHabit(h, todayKey());
      render();
      openSettings();
    };

    // Chủ đề + Ngày/Đêm
    sheet.querySelector('.themes').onclick = e => {
      const b = e.target.closest('[data-theme]');
      if (!b) return;
      settings.theme = b.dataset.theme;
      saveSettings(); applyTheme(); openSettings();
    };
    $('modeSeg').onclick = e => {
      const b = e.target.closest('[data-mode]');
      if (!b) return;
      settings.mode = b.dataset.mode;
      saveSettings(); applyTheme(); openSettings();
    };

    // Nhóm: đổi tên, đổi màu, xoá, thêm
    const catList = $('catList');
    catList.addEventListener('input', e => {
      const id = e.target.closest('[data-id]').dataset.id;
      const cat = findCat(id);
      const row = catList.querySelector(`.cat-row[data-id="${id}"]`);
      if (e.target.type === 'color') {           // màu tự chọn
        cat.color = e.target.value;
        row.querySelector('.cat-color').style.background = cat.color;
        row.querySelector('input[type=text]').style.color = cat.color;
      } else {
        cat.name = e.target.value.trim() || 'Nhóm';
      }
      refreshAll();
    });
    catList.addEventListener('change', e => { if (e.target.type === 'color') openSettings(); });
    catList.addEventListener('click', e => {
      const holder = e.target.closest('[data-id]');
      if (!holder) return;
      const id = holder.dataset.id;
      if (e.target.closest('.del')) {
        settings.categories = settings.categories.filter(c => c.id !== id);
        refreshAll(); openSettings();
      } else if (e.target.closest('.cat-color')) {
        openSwatch = openSwatch === id ? null : id;
        openSettings();
      } else if (e.target.closest('[data-color]')) {
        findCat(id).color = e.target.closest('[data-color]').dataset.color;
        refreshAll(); openSettings();
      }
    });
    $('addCat').onclick = () => {
      const used = settings.categories.map(c => c.color.toUpperCase());
      const color = SOFT_COLORS.find(c => !used.includes(c)) || SOFT_COLORS[0];
      settings.categories.push({ id: 'c' + Date.now(), name: 'Nhóm mới', color });
      refreshAll();
      openSettings();
      const inputs = sheet.querySelectorAll('.cat-row input[type=text]');
      inputs[inputs.length - 1].select();
    };
    $('settingsDone').onclick = () => { openSwatch = null; closeSheet(); };
    openSheet();
    sheet.scrollTop = scroll;
  }
  $('settingsBtn').addEventListener('click', openSettings);

  /* =========================================================
     8b. DỌN DỮ LIỆU: xoá công việc (và ghi chú) trong một khoảng ngày,
         hoặc reset toàn bộ app. Khoảng ngày được nhớ trong lúc mở bảng cài đặt.
     ========================================================= */
  const cleanup = { from: '', to: shiftKey(todayKey(), -1), notes: false };

  // Ngày "2026-09-26" có nằm trong khoảng đã chọn không (trống = không giới hạn)
  const inRange = key => (!cleanup.from || key >= cleanup.from) && (!cleanup.to || key <= cleanup.to);

  function cleanupTargets() {
    const days = Object.keys(data).filter(inRange);
    const taskCount = days.reduce((s, k) => s + data[k].length, 0);
    const noteIds = cleanup.notes ? notes.filter(n => inRange(toKey(new Date(n.updated)))).map(n => n.id) : [];
    return { days, taskCount, noteIds };
  }

  function storageKB() {
    let size = 0;
    [DATA_KEY, SETTINGS_KEY, NOTES_KEY, HABITS_KEY, PLANS_KEY].forEach(k => {
      try { size += new Blob([localStorage.getItem(k) || '']).size; } catch (e) {}
    });
    return Math.max(1, Math.round(size / 1024));
  }

  function setupCleanup() {
    const updateInfo = () => {
      $('clUsage').textContent =
        `Đang lưu: ${Object.keys(data).length} ngày có việc · ${notes.length} ghi chú · khoảng ${storageKB()} KB`;
      $('clFrom').value = cleanup.from;
      $('clTo').value = cleanup.to;
      $('clNotes').checked = cleanup.notes;
      const t = cleanupTargets();
      const parts = [];
      if (t.taskCount) parts.push(`${t.taskCount} công việc (${t.days.length} ngày)`);
      if (t.noteIds.length) parts.push(`${t.noteIds.length} ghi chú`);
      $('clCount').textContent = parts.length ? 'Sẽ xoá: ' + parts.join(' · ') : 'Không có dữ liệu nào trong khoảng này.';
      $('clRun').disabled = !parts.length;
    };

    $('clFrom').onchange = e => { cleanup.from = e.target.value; updateInfo(); };
    $('clTo').onchange = e => { cleanup.to = e.target.value; updateInfo(); };
    $('clNotes').onchange = e => { cleanup.notes = e.target.checked; updateInfo(); };
    $('clBeforeToday').onclick = () => { cleanup.from = ''; cleanup.to = shiftKey(todayKey(), -1); updateInfo(); };
    $('clAll').onclick = () => { cleanup.from = ''; cleanup.to = ''; updateInfo(); };

    $('clRun').onclick = () => {
      const t = cleanupTargets();
      const range = `${cleanup.from ? fmtDay(cleanup.from) : 'từ đầu'} → ${cleanup.to ? fmtDay(cleanup.to) : 'đến hết'}`;
      if (!confirm(`Xoá vĩnh viễn dữ liệu (${range})?\n${$('clCount').textContent}\n\nKhông thể khôi phục.`)) return;
      t.days.forEach(k => delete data[k]);
      notes = notes.filter(n => !t.noteIds.includes(n.id));
      saveData();
      saveNotes();
      render();
      updateInfo();
      $('clCount').textContent = 'Đã xoá xong ✓';
    };

    $('resetAll').onclick = () => {
      if (!confirm('Xoá TOÀN BỘ công việc, ghi chú và nhóm màu, đưa app về như mới?\n\nKhông thể khôi phục.')) return;
      try { [DATA_KEY, SETTINGS_KEY, NOTES_KEY, HABITS_KEY, PLANS_KEY].forEach(k => localStorage.removeItem(k)); } catch (e) {}
      location.replace(location.pathname + location.search);
    };

    updateInfo();
  }

  // "2026-09-26" -> "26/09/2026"
  const fmtDay = key => key.split('-').reverse().join('/');

  /* =========================================================
     9. SỰ KIỆN DANH SÁCH & ĐỔI NGÀY
     ========================================================= */
  $('tasksArea').addEventListener('click', e => {
    const el = e.target.closest('.item');
    if (!el) return;
    const id = Number(el.dataset.id);
    if (e.target.closest('.check')) {
      const t = getTasks().find(x => x.id === id);
      const pi = t.planItem && findPlanItem(t.planItem);
      if (pi) { pi.it.done = !t.completed; savePlans(); }
      patchTask(id, { completed: !t.completed });
    }
    else if (e.target.closest('.del')) deleteTask(id);
    else if (e.target.closest('.move')) {
      if (e.target.closest('.move.copied')) return toast('Việc này đã có ở ' + nextDayLabel());
      const label = nextDayLabel();
      copyToNextDay(getTasks().filter(x => x.id === id));
      toast('Đã chép sang ' + label + ' ✓');
    }
    else openEdit(id);
  });

  $('planBanner').addEventListener('click', () => {
    span = 'week';
    render();
    window.scrollTo(0, 0);
  });

  $('carryAll').addEventListener('click', () => {
    const items = carryCandidates();
    const label = nextDayLabel();
    copyToNextDay(items);
    toast(`Đã chép ${items.length} việc sang ${label} ✓`);
  });

  function goTo(key) { currentKey = key; render(); }
  // Nút dưới đáy: lùi/tiến 1 ngày, 1 tuần hoặc 1 tháng tuỳ chế độ xem
  const step = dir => span === 'week' ? shiftKey(currentKey, 7 * dir)
                    : span === 'month' ? monthKey(currentKey, dir)
                    : shiftKey(currentKey, dir);
  $('prevBtn').addEventListener('click', () => goTo(step(-1)));
  $('nextBtn').addEventListener('click', () => goTo(step(1)));
  $('todayBtn').addEventListener('click', () => goTo(todayKey()));
  $('datePicker').addEventListener('change', e => { if (e.target.value) goTo(e.target.value); });

  // Để web mở qua nửa đêm rồi quay lại: tự nhảy sang ngày mới
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    const now = todayKey();
    if (now !== lastToday) {
      if (currentKey === lastToday) currentKey = now;
      lastToday = now;
      render();
    }
  });

  /* =========================================================
     10. GHI CHÚ TỰ DO
     Dùng địa chỉ #notes và #note-<id> để nút "Quay lại" của điện thoại hoạt động đúng.
     ========================================================= */
  let openNoteId = null;

  function fmtStamp(ts) {
    const d = new Date(ts);
    return `${pad(d.getHours())}:${pad(d.getMinutes())} · ${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`;
  }

  function renderNotes() {
    const sorted = [...notes].sort((a, b) => b.updated - a.updated);
    $('notesList').innerHTML = sorted.length
      ? sorted.map(n => {
          const lines = n.text.trim().split('\n').filter(l => l.trim());
          return `
            <li class="note" data-id="${n.id}">
              <div class="note-title">${esc(lines[0] || '(Trống)')}</div>
              ${lines[1] ? `<div class="note-preview">${esc(lines.slice(1).join(' · '))}</div>` : ''}
              <div class="note-time">${fmtStamp(n.updated)}</div>
            </li>`;
        }).join('')
      : '<li class="notes-empty">Chưa có ghi chú nào.</li>';
  }

  // Bỏ ghi chú trống khi rời trình soạn
  function cleanEmptyNote() {
    if (openNoteId === null) return;
    const n = notes.find(x => x.id === openNoteId);
    if (n && !n.text.trim()) { notes = notes.filter(x => x.id !== openNoteId); saveNotes(); }
    openNoteId = null;
  }

  // Hiển thị màn hình theo địa chỉ: "" = kế hoạch, "#notes", "#note-123"
  function route() {
    const h = location.hash;
    const noteMatch = h.match(/^#note-(\d+)$/);
    const note = noteMatch && notes.find(n => n.id === Number(noteMatch[1]));

    if (!note) cleanEmptyNote();

    $('planView').hidden = h === '#notes' || !!note;
    $('dayNav').hidden = $('planView').hidden;
    $('notesView').hidden = h !== '#notes' || !!note;
    $('editorView').hidden = !note;

    if (note) {
      openNoteId = note.id;
      $('noteText').value = note.text;
      $('savedText').textContent = 'Tự động lưu';
      if (!note.text) $('noteText').focus();
    } else if (h === '#notes') {
      renderNotes();
    } else {
      render();
    }
    window.scrollTo(0, 0);
  }
  window.addEventListener('popstate', route);

  // Chuyển màn hình: ghi vào lịch sử để nút "Quay lại" của điện thoại hoạt động
  function go(hash) {
    const depth = (history.state && history.state.d) || 0;
    history.pushState({ d: depth + 1 }, '', hash ? '#' + hash : location.pathname + location.search);
    route();
  }
  // Nút "‹" trong app: quay lại nếu có màn hình trước, không thì chuyển thẳng
  function back(hash) {
    if (history.state && history.state.d > 0) history.back();
    else { history.replaceState({ d: 0 }, '', hash ? '#' + hash : location.pathname + location.search); route(); }
  }

  $('notesBtn').addEventListener('click', () => go('notes'));
  document.querySelectorAll('[data-go]').forEach(b =>
    b.addEventListener('click', () => back(b.dataset.go)));

  $('newNoteBtn').addEventListener('click', () => {
    const n = { id: Date.now(), text: '', updated: Date.now() };
    notes.push(n);
    saveNotes();
    go('note-' + n.id);
  });

  $('notesList').addEventListener('click', e => {
    const li = e.target.closest('.note');
    if (li) go('note-' + li.dataset.id);
  });

  // Tự động lưu khi gõ
  $('noteText').addEventListener('input', e => {
    const n = notes.find(x => x.id === openNoteId);
    if (!n) return;
    n.text = e.target.value;
    n.updated = Date.now();
    saveNotes();
    $('savedText').textContent = 'Đã lưu ✓';
  });

  $('noteDelBtn').addEventListener('click', () => {
    const n = notes.find(x => x.id === openNoteId);
    if (n && n.text.trim() && !confirm('Xoá ghi chú này?')) return;
    notes = notes.filter(x => x.id !== openNoteId);
    saveNotes();
    openNoteId = null;
    back('notes');
  });

  route();
</script>
</body>
</html>
