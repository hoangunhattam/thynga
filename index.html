<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E3ECE6">
<!-- Cho phép mở như một app khi thêm vào màn hình chính -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kế hoạch">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Kế hoạch của Thy Nga</title>
<!-- Icon màn hình chính + thông tin cài đặt app (các file nằm cùng thư mục) -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">

<style>
  /* ========== MÀU SẮC CHUNG ==========
     Giá trị mặc định (chủ đề Xanh sage). Khi đổi chủ đề trong Cài đặt,
     JavaScript sẽ ghi đè các biến này (xem mục THEMES trong script). */
  :root {
    --green: #5E8C74;        /* màu nhấn chính của chủ đề */
    --on-accent: #FFFFFF;    /* chữ trên nền màu nhấn */
    --bg: #E3ECE6;
    --bg2: #F2F6F3;
    --card: #FFFFFF;
    --text: #2F3A35;
    --muted: #86918B;
    --line: #E4EAE6;
    --line2: #C5CEC9;
    --seg: rgba(0, 0, 0, .05);
    --nav: rgba(255, 255, 255, .8);
    --shadow: 0 2px 12px rgba(60, 80, 70, .07);
    --danger: #C0605A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg2); }
  body { min-height: 100vh; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg2) 420px);
    color: var(--text);
    font-size: 17px;
    line-height: 1.4;
    -webkit-tap-highlight-color: transparent;
  }

  button { font: inherit; color: inherit; cursor: pointer; }
  input, textarea { font: inherit; color: var(--text); }

  .app {
    max-width: 560px;
    margin: 0 auto;
    padding: calc(18px + env(safe-area-inset-top)) 16px calc(100px + env(safe-area-inset-bottom));
  }

  /* ========== TIÊU ĐỀ ========== */
  .brand {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--green);
  }
  header .row {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 10px;
    margin: 4px 0 16px;
  }
  .date { font-size: 21px; font-weight: 700; white-space: nowrap; }
  .relative { font-size: 15px; color: var(--muted); }
  .tools { display: flex; gap: 6px; flex-shrink: 0; }

  .pill {
    position: relative;
    height: 40px;
    padding: 0 14px;
    border: 1px solid var(--line);
    border-radius: 20px;
    background: var(--card);
    font-size: 15px;
    display: flex;
    align-items: center;
  }
  .icon-btn { width: 40px; padding: 0; justify-content: center; }
  .icon-btn svg { width: 20px; height: 20px; }
  /* Ô date trong suốt phủ lên nút để mở bộ chọn ngày của điện thoại */
  .pill input[type=date] {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    font-size: 16px;
  }

  /* ========== Ô THÊM CÔNG VIỆC ========== */
  .add { display: flex; gap: 8px; }
  .add input {
    flex: 1;
    min-width: 0;
    height: 54px;
    padding: 0 16px;
    font-size: 17px; /* >= 16px để iPhone không tự zoom */
    border: 1.5px solid var(--line);
    border-radius: 14px;
    background: var(--card);
  }
  .add input:focus { outline: none; border-color: var(--green); }
  .add button {
    width: 54px;
    height: 54px;
    flex-shrink: 0;
    border: none;
    border-radius: 14px;
    background: var(--green);
    color: var(--on-accent);
    font-size: 30px;
    line-height: 1;
  }
  #addFields { margin: 10px 0 14px; }

  /* ========== NHÓM (chip màu) + THỜI GIAN ========== */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    --c: #888;
    height: 36px;
    padding: 0 12px;
    border: 1.5px solid var(--line);
    border-radius: 18px;
    background: var(--card);
    font-size: 15px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  .chip i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
  .chip.on {
    border-color: var(--c);
    background: color-mix(in srgb, var(--c) 14%, var(--card));
    color: var(--c);
    font-weight: 600;
  }
  .chip.time.on { --c: var(--green); }

  .time-box {
    margin-top: 10px;
    padding: 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
  }
  .seg { display: flex; background: var(--seg); border-radius: 12px; padding: 3px; }
  .seg button {
    flex: 1;
    height: 36px;
    border: none;
    border-radius: 8px;
    background: none;
    font-size: 14px;
    color: var(--muted);
  }
  .seg button.on { background: var(--card); color: var(--text); font-weight: 600; box-shadow: 0 1px 4px rgba(0,0,0,.08); }

  .range, .dur { display: flex; align-items: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .range input, .dur input {
    height: 44px;
    padding: 0 10px;
    font-size: 17px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    background: var(--card);
    min-width: 0;
  }
  .range input { flex: 1; }
  .range span, .dur span { color: var(--muted); font-size: 15px; }
  .dur input { width: 90px; }
  .dur .chip { height: 34px; }
  .hint { margin-top: 10px; font-size: 13px; color: var(--muted); }

  /* ========== CHUYỂN CHẾ ĐỘ XEM ========== */

  /* ========== DANH SÁCH ========== */
  .list {
    list-style: none;
    background: var(--card);
    box-shadow: var(--shadow);
    border-radius: 18px;
    overflow: hidden;
  }
  .list:empty { display: none; }

  .item {
    display: flex;
    align-items: center;
    min-height: 58px;
    border-bottom: 1px solid var(--line);
  }
  .item:last-child { border-bottom: none; }

  .check {
    width: 50px;
    height: 58px;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    background: none;
    border: none;
  }
  .check span {
    width: 26px;
    height: 26px;
    border: 2px solid var(--line2);
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--card);
    color: var(--on-accent);
  }
  .check svg { width: 14px; height: 14px; opacity: 0; }
  .done .check span { background: var(--green); border-color: var(--green); }
  .done .check svg { opacity: 1; }

  .body { flex: 1; min-width: 0; padding: 10px 4px; cursor: pointer; }
  .text { word-break: break-word; color: var(--c, var(--text)); }   /* tên việc mang màu của nhóm */
  .meta { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .meta b { font-weight: 600; color: var(--c); }
  .done .text { opacity: .5; text-decoration: line-through; }
  .done .meta { opacity: .6; }

  .del {
    width: 46px;
    height: 58px;
    flex-shrink: 0;
    border: none;
    background: none;
    color: var(--muted);
    opacity: .6;
    font-size: 26px;
    line-height: 1;
  }

  /* ========== TIẾN ĐỘ + TỔNG THEO NHÓM ========== */
  .progress { margin-top: 18px; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--green); transition: width .25s; }
  .progress p { margin-top: 8px; text-align: center; font-size: 15px; color: var(--muted); }

  .totals {
    margin-top: 12px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px 14px;
    font-size: 14px;
    color: var(--muted);
  }
  .totals span { display: inline-flex; align-items: center; gap: 6px; }
  .totals i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
  .totals b { color: var(--text); font-weight: 600; }

  /* ========== THANH ĐỔI NGÀY (dưới đáy) ========== */
  nav {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: var(--nav);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    border-top: 1px solid var(--line);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    z-index: 10;
  }
  nav .inner { max-width: 560px; margin: 0 auto; display: flex; gap: 8px; }
  nav button {
    flex: 1;
    height: 50px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--card);
    font-size: 16px;
    font-weight: 600;
  }
  #todayBtn { color: var(--green); border-color: var(--green); }

  /* ========== GHI CHÚ ========== */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    min-height: 44px;
    margin-bottom: 14px;
  }
  .topbar h1 { font-size: 20px; }
  .link-btn {
    border: none;
    background: none;
    color: var(--green);
    font-weight: 600;
    font-size: 17px;
    height: 44px;
    padding: 0 4px;
  }
  .link-btn.danger { color: var(--danger); }
  .new-note {
    width: 100%;
    height: 54px;
    border: none;
    border-radius: 14px;
    background: var(--green);
    color: var(--on-accent);
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 14px;
  }
  .notes { list-style: none; }
  .note {
    background: var(--card);
    box-shadow: var(--shadow);
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 10px;
    cursor: pointer;
  }
  .note-title { font-weight: 600; word-break: break-word; }
  .note-preview {
    font-size: 14px;
    color: var(--muted);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .note-time { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .notes-empty { text-align: center; color: var(--muted); padding: 30px 0; }

  #noteText {
    width: 100%;
    height: calc(100vh - 150px);
    height: calc(100dvh - 150px);
    padding: 14px;
    font-size: 17px;
    line-height: 1.55;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--card);
    resize: none;
  }
  #noteText:focus { outline: none; border-color: var(--green); }
  .saved { font-size: 13px; color: var(--muted); }

  /* ========== BẢNG TRƯỢT TỪ DƯỚI LÊN (sửa việc / cài đặt) ========== */
  .backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, .35);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 20;
  }
  .sheet {
    width: 100%;
    max-width: 560px;
    max-height: 88vh;
    overflow-y: auto;
    background: var(--card);
    border-radius: 20px 20px 0 0;
    padding: 20px 16px calc(16px + env(safe-area-inset-bottom));
  }
  .sheet h2 { font-size: 18px; margin-bottom: 14px; }
  .sheet .text-input {
    width: 100%;
    height: 50px;
    padding: 0 14px;
    font-size: 17px;
    border: 1.5px solid var(--line);
    border-radius: 12px;
    margin-bottom: 12px;
  }
  .sheet .text-input:focus { outline: none; border-color: var(--green); }
  .actions { display: flex; gap: 8px; margin-top: 18px; }
  .actions button {
    flex: 1;
    height: 50px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--card);
    font-weight: 600;
  }
  .actions .primary { background: var(--green); border-color: var(--green); color: var(--on-accent); }
  .actions .danger { color: var(--danger); flex: 0 0 auto; padding: 0 16px; }

  /* Cài đặt nhóm */
  .cat-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .cat-row input[type=text] {
    flex: 1;
    min-width: 0;
    height: 46px;
    padding: 0 12px;
    font-size: 17px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
  }
  .cat-color {
    width: 40px;
    height: 40px;
    flex-shrink: 0;
    border: 3px solid var(--card);
    border-radius: 50%;
    box-shadow: 0 0 0 1px var(--line);
  }
  /* Bảng màu gợi ý hiện khi chạm vào vòng màu */
  .swatches { display: flex; flex-wrap: wrap; gap: 8px; margin: -2px 0 14px 50px; }
  .swatch {
    position: relative;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 3px solid var(--card);
    box-shadow: 0 0 0 1px var(--line);
  }
  .swatch.on { box-shadow: 0 0 0 2px var(--text); }
  .swatch.custom { background: conic-gradient(#e88, #ec8, #8c8, #8ce, #a8e, #e88); overflow: hidden; }
  .swatch.custom input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; }

  /* Chủ đề */
  .themes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
  .theme {
    height: 62px;
    border-radius: 14px;
    border: 2px solid transparent;
    padding: 6px 8px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    font-size: 13px;
    color: #3A423E;
  }
  .theme.on { border-color: var(--text); }
  .theme i { width: 14px; height: 14px; border-radius: 50%; }
  .sheet .seg { margin-top: 12px; }
  input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
  input[type=color]::-webkit-color-swatch { border: none; border-radius: 50%; }
  .cat-row .del { height: 46px; width: 40px; }
  /* Dọn dữ liệu */
  .sheet h3 {
    font-size: 16px;
    margin: 24px 0 4px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
  }
  .sheet h3.first { margin-top: 0; padding-top: 0; border-top: none; }
  .cl-dates { display: flex; gap: 8px; margin-top: 10px; }
  .cl-dates label { flex: 1; min-width: 0; font-size: 13px; color: var(--muted); }
  .cl-dates input {
    display: block;
    width: 100%;
    height: 44px;
    margin-top: 4px;
    padding: 0 8px;
    font-size: 16px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    background: var(--card);
  }
  .check-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 14px;
    font-size: 15px;
  }
  .check-row input { width: 22px; height: 22px; accent-color: var(--green); flex-shrink: 0; }
  .cl-count { margin: 12px 0 10px; font-size: 14px; font-weight: 600; }
  .danger-btn, .reset-btn {
    width: 100%;
    height: 48px;
    border-radius: 12px;
    font-weight: 600;
  }
  .danger-btn { border: none; background: var(--danger); color: #fff; }
  .danger-btn:disabled { opacity: .35; }
  .reset-btn { margin-top: 10px; border: 1.5px solid var(--danger); background: none; color: var(--danger); }

  .add-cat {
    width: 100%;
    height: 46px;
    border: 1.5px dashed var(--line);
    border-radius: 12px;
    background: none;
    color: var(--muted);
  }

  /* Nút "Xong" trong hộp thời gian */
  .time-done {
    display: block;
    width: 100%;
    height: 42px;
    margin-top: 12px;
    border: none;
    border-radius: 10px;
    background: var(--green);
    color: var(--on-accent);
    font-weight: 600;
  }

  /* Lặp lại (việc hằng ngày) */
  .sub-label { font-size: 14px; font-weight: 600; color: var(--muted); margin: 16px 0 8px; }
  .wd-chips { display: flex; gap: 6px; margin-top: 10px; }
  .wd-chips .chip { flex: 1; padding: 0; justify-content: center; --c: var(--green); }
  .habit-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }
  .habit-row div { flex: 1; min-width: 0; }
  .habit-row b { display: block; font-weight: 600; color: var(--c, var(--text)); word-break: break-word; }
  .habit-row small { color: var(--muted); font-size: 13px; }
  .habit-row button {
    flex-shrink: 0;
    height: 36px;
    padding: 0 12px;
    border: 1px solid var(--line);
    border-radius: 18px;
    background: var(--card);
    color: var(--danger);
    font-size: 14px;
  }

  /* Ngày / Tuần / Tháng */
  .span-tabs { margin-bottom: 14px; }

  /* Xem theo tuần */
  .wk-day {
    background: var(--card);
    box-shadow: var(--shadow);
    border-radius: 16px;
    padding: 12px 14px;
    margin-bottom: 10px;
    cursor: pointer;
    border: 2px solid transparent;
  }
  .wk-day.today { border-color: var(--green); }
  .wk-day.past { opacity: .7; }
  .wk-head { display: flex; align-items: baseline; gap: 8px; }
  .wk-head b { font-size: 16px; }
  .wk-head span { font-size: 14px; color: var(--muted); }
  .wk-head .wk-count { margin-left: auto; font-size: 13px; }
  .wk-tasks { list-style: none; margin-top: 6px; }
  .wk-tasks li {
    display: flex;
    gap: 6px;
    font-size: 15px;
    padding: 2px 0;
    color: var(--c, var(--text));
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .wk-tasks li.done { opacity: .45; text-decoration: line-through; }
  .wk-tasks small { color: var(--muted); font-size: 13px; flex-shrink: 0; }
  .wk-more, .wk-empty { font-size: 13px; color: var(--muted); margin-top: 4px; }

  /* Xem theo tháng */
  .month {
    background: var(--card);
    box-shadow: var(--shadow);
    border-radius: 18px;
    padding: 10px 6px;
  }
  .m-row { display: grid; grid-template-columns: repeat(7, 1fr); }
  .m-wd { text-align: center; font-size: 12px; color: var(--muted); padding: 4px 0 8px; font-weight: 600; }
  .m-cell {
    min-height: 62px;
    margin: 2px;
    padding: 4px 2px;
    border-radius: 10px;
    text-align: center;
    cursor: pointer;
  }
  .m-cell.out { opacity: .35; }
  .m-num { font-size: 15px; width: 28px; height: 28px; line-height: 28px; margin: 0 auto; border-radius: 50%; }
  .m-cell.today .m-num { background: var(--green); color: var(--on-accent); font-weight: 700; }
  .m-dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; margin-top: 4px; }
  .m-dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--c, #B9C2BD); }
  .m-dots i.done { opacity: .35; }
  .m-more { font-size: 10px; color: var(--muted); line-height: 1.2; }
  .range-sum { margin-top: 16px; text-align: center; font-size: 15px; color: var(--muted); }

  /* Chép việc chưa xong sang ngày sau */
  .move {
    width: 38px;
    height: 58px;
    flex-shrink: 0;
    border: none;
    background: none;
    color: var(--muted);
    font-size: 11px;
    line-height: 1.1;
  }
  .move b { display: block; font-size: 18px; font-weight: 400; }
  .move.copied { color: var(--green); }
  .carry-all {
    width: 100%;
    height: 46px;
    margin-top: 10px;
    border: 1.5px dashed var(--line2);
    border-radius: 14px;
    background: none;
    color: var(--muted);
    font-size: 15px;
  }
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(86px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    background: var(--text);
    color: var(--card);
    padding: 10px 18px;
    border-radius: 20px;
    font-size: 15px;
    z-index: 30;
    opacity: 0;
    transition: opacity .2s;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show { opacity: .92; }

  #editFields [data-act=time] { display: none; }
  #editFields .time-box { margin-top: 12px; }

  /* ========== KẾ HOẠCH TUẦN ========== */
  .plan {
    background: var(--card);
    box-shadow: var(--shadow);
    border-radius: 18px;
    padding: 12px 14px;
    margin-bottom: 14px;
  }
  .plan-h { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
  .plan-h b { font-size: 16px; }
  .plan-h span, .g-count { font-size: 13px; color: var(--muted); }
  .goal { border-top: 1px solid var(--line); padding: 10px 0; }
  .goal:first-of-type { border-top: none; }
  .g-head { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .g-head .arrow { width: 16px; color: var(--muted); font-size: 12px; flex-shrink: 0; }
  .g-title { flex: 1; min-width: 0; font-weight: 600; color: var(--c, var(--text)); word-break: break-word; }
  .g-bar { height: 5px; background: var(--line); border-radius: 3px; margin: 6px 0 0 24px; overflow: hidden; }
  .g-bar i { display: block; height: 100%; background: var(--c, var(--green)); border-radius: 3px; }
  .p-item { display: flex; align-items: center; gap: 6px; padding: 2px 0 2px 18px; }
  .p-ck {
    width: 40px; height: 40px; flex-shrink: 0;
    display: grid; place-items: center;
    background: none; border: none;
  }
  .p-ck span {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid var(--line2); background: var(--card);
    display: grid; place-items: center; color: var(--on-accent);
  }
  .p-ck svg { width: 12px; height: 12px; opacity: 0; }
  .p-item.done .p-ck span { background: var(--green); border-color: var(--green); }
  .p-item.done .p-ck svg { opacity: 1; }
  .p-text { flex: 1; min-width: 0; font-size: 15px; word-break: break-word; cursor: text; }
  .p-item.done .p-text { opacity: .5; text-decoration: line-through; }
  .p-edit {
    flex: 1; min-width: 0; height: 36px; padding: 0 8px; font-size: 16px;
    border: 1.5px solid var(--green); border-radius: 8px; background: var(--card);
  }
  .p-day {
    flex-shrink: 0; height: 30px; padding: 0 10px;
    border: 1.5px solid var(--line); border-radius: 15px;
    background: var(--card); color: var(--muted); font-size: 13px;
  }
  .p-day.on {
    border-color: var(--green); color: var(--green); font-weight: 600;
    background: color-mix(in srgb, var(--green) 10%, var(--card));
  }
  .p-del { width: 30px; height: 36px; flex-shrink: 0; border: none; background: none; color: var(--muted); opacity: .6; font-size: 20px; }
  .p-wd { display: flex; gap: 5px; padding: 4px 0 8px 64px; }
  .p-wd button {
    flex: 1; height: 32px; padding: 0;
    border: 1.5px solid var(--line); border-radius: 16px; background: var(--card); font-size: 12px;
  }
  .p-wd button.on { border-color: var(--green); color: var(--green); font-weight: 600; }
  .p-add {
    width: 100%; height: 40px; margin-top: 4px; padding: 0 12px; font-size: 16px;
    border: 1.5px dashed var(--line2); border-radius: 10px; background: none;
  }
  .p-add:focus { outline: none; border-style: solid; border-color: var(--green); }
  .goal .p-add { width: calc(100% - 24px); margin-left: 24px; }
  .g-edit { margin: 6px 0 0 24px; border: none; background: none; color: var(--muted); font-size: 13px; text-decoration: underline; }
  .plan .carry-all { margin-top: 12px; }
  .ptag {
    display: inline-block; max-width: 100%;
    padding: 0 7px; border-radius: 8px;
    background: color-mix(in srgb, var(--green) 12%, var(--card)); color: var(--green);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; vertical-align: bottom;
  }
  .plan-banner {
    width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    margin-bottom: 12px; padding: 10px 14px;
    border: none; border-radius: 14px; background: var(--card); box-shadow: var(--shadow);
    font-size: 14px; text-align: left; color: var(--text);
  }
  .plan-banner span { color: var(--green); font-weight: 600; flex-shrink: 0; }

  [hidden] { display: none !important; }
</style>
</head>
